name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run pytest and benchmark suite
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/lore-home
          USERPROFILE: ${{ runner.temp }}/lore-home
          APPDATA: ${{ runner.temp }}/lore-home/AppData/Roaming
          MESA_LORE_DB: ${{ runner.temp }}/lore.db
        shell: bash
        run: |
          mkdir -p "$HOME"
          python -m pytest -q
          python bench/run.py --require all

      - name: Run Windows portability tests
        if: runner.os == 'Windows'
        env:
          HOME: ${{ runner.temp }}/lore-home
          USERPROFILE: ${{ runner.temp }}/lore-home
          APPDATA: ${{ runner.temp }}/lore-home/AppData/Roaming
          MESA_LORE_DB: ${{ runner.temp }}/lore.db
        run: python -m pytest -q tests/test_r9_platforms.py tests/test_r9_isolation.py tests/test_r9_notebook.py tests/test_r9_wrappers.py
